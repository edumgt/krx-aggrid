name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repo files
        run: ls -la

      - name: Print environment info
        run: |
          echo "Run by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Sanity check
        run: |
          test -f README.md && echo "README.md OK"
          test -f docker-compose.yml && echo "docker-compose.yml OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run unit tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build containers
        run: docker compose build

      - name: Generate test.md
        run: |
          cat > test.md <<EOF
          # Test Report

          - Run number: ${{ github.run_number }}
          - Triggered by: ${{ github.event_name }}
          - Actor: ${{ github.actor }}
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          - Generated at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Commit and push test.md
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update test.md [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
